spring:
  application:
    name: roadnet-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/roadnet
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ROADNETSuperSecretKeyForJWTTokenGeneration2026ThatMustBeAtLeast256BitsLongForSecurity
  expiration: 86400000

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

app:
  cors:
    allowed-origins: http://localhost:5173
  upload:
    max-size: 5242880
    allowed-types: image/jpeg,image/png,image/webp
    directory: uploads/
